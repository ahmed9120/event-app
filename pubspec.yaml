name: event_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_bounceable: ^1.2.0
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  location: ^8.0.1
  intl:  #for selectedDate format & localization
  flutter_easyloading: ^3.0.5
  bot_toast: ^4.1.3
  image_picker: ^1.1.2
  animated_custom_dropdown: ^3.1.1
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  firebase_auth: ^5.7.0
  google_maps_flutter: ^2.12.3
  geocoding: ^2.1.0
  google_sign_in: ^7.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
